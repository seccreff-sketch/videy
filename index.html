<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Tonton Video</title>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 16px;
      background: #101018;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .page {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }
    .top-card {
      width: 100%;
      padding: 18px;
      background: #191927;
      border: 1px solid #2a2a3d;
      border-radius: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .description {
      margin: 0;
      color: #bfc3d3;
      line-height: 1.5;
    }
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }
    .button {
      width: 100%;
      min-height: 48px;
      padding: 14px 16px;
      border: 0;
      border-radius: 8px;
      background: #ff3366;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .button.gray { background: #343449; }

    .video-section {
      width: 100%;
      margin-top: 34px;
      padding: 0;
    }
    .video-heading {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .video-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    .video-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      border: 0;
    }
    .video-lock {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #000;
      text-align: center;
    }
    .video-lock h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .video-lock p {
      margin: 0;
      color: #c7cad8;
      font-size: 14px;
      line-height: 1.5;
    }

    .native-wrap {
      margin-top: 28px;
      padding: 14px;
      border: 1px solid #2a2a3d;
      border-radius: 14px;
      background: #151521;
    }
    .native-label {
      margin: 0 0 10px;
      font-size: 12px;
      color: #9ea4b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .native-banner {
      min-height: 120px;
      border-radius: 12px;
      overflow: hidden;
      background: #1c1c2b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 640px) {
      body { padding: 40px 16px; }
      .top-card { padding: 24px; }
      .buttons { flex-direction: row; }
      .button { flex: 1; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="top-card">
      <h1>🎬 Tonton Video</h1>
      <p class="description">
        Klik tombol buka iklan terlebih dahulu. Setelah kembali ke halaman ini,
        tekan tombol buka video.
      </p>

      <div class="buttons">
        <a
          id="adButton"
          class="button"
          href="https://www.effectivecpmnetwork.com/paig56k51s?key=3ef24098f954543c64765bd05fddc91d"
          target="_blank"
          rel="noopener noreferrer nofollow"
        >
          ▶ Buka Iklan
        </a>

        <button id="unlockButton" class="button gray" type="button">
          🔒 Buka Video
        </button>
      </div>
    </section>

    <section id="videoSection" class="video-section">
      <h2 class="video-heading">Video</h2>

      <div class="video-area">
        <div id="videoLock" class="video-lock">
          <div>
            <h2>Video masih terkunci</h2>
            <p>Klik “Buka Iklan”, kembali ke halaman ini, lalu tekan “Buka Video”.</p>
          </div>
        </div>

        <iframe
          id="videoFrame"
          class="video-frame"
          data-src="https://jumpshare.com/embed/Cf020RMwp0NWDUacjZSn"
          allow="fullscreen"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <section class="native-wrap">
      <p class="native-label">Iklan</p>
      <div class="native-banner">
        <!-- <script async="async" data-cfasync="false" src="https://pl30785832.effectivecpmnetwork.com/814b3e63e48f595e7768d6876e1e5cf9/invoke.js"></script>
<div id="container-814b3e63e48f595e7768d6876e1e5cf9"></div>
 -->
        <span style="color:#9ea4b8;font-size:14px;">Native banner slot</span>
      </div>
    </section>
  </main>

  <script>
    const adButton = document.getElementById("adButton");
    const unlockButton = document.getElementById("unlockButton");
    const videoLock = document.getElementById("videoLock");
    const videoFrame = document.getElementById("videoFrame");
    const videoSection = document.getElementById("videoSection");

    adButton.addEventListener("click", function () {
      sessionStorage.setItem("adClicked", "yes");
    });

    unlockButton.addEventListener("click", function () {
      if (sessionStorage.getItem("adClicked") !== "yes") {
        alert("Klik tombol Buka Iklan terlebih dahulu.");
        return;
      }

      videoFrame.src = videoFrame.dataset.src;
      videoFrame.style.display = "block";
      videoLock.style.display = "none";

      unlockButton.textContent = "✓ Video Terbuka";
      unlockButton.disabled = true;

      videoSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });
  </script>
</body>
</html>
