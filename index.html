<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Tonton Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #101018;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .ad-title {
      margin: 0 0 6px;
      color: #999;
      font-size: 11px;
      text-align: center;
      text-transform: uppercase;
    }

    .ad-box {
      width: 100%;
      min-height: 250px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #181824;
      border: 1px solid #29293b;
      border-radius: 10px;
    }

    .card {
      padding: 22px;
      background: #191927;
      border: 1px solid #2a2a3d;
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .description {
      margin: 0;
      color: #bfc3d3;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .button {
      width: 100%;
      min-height: 48px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #ff3366;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .button.gray {
      background: #343449;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .video-section {
      margin-top: 32px;
    }

    .video-heading {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .video-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 10px;
    }

    .video-frame {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-lock {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #000;
      text-align: center;
    }

    .video-lock h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .video-lock p {
      margin: 0;
      color: #bfc3d3;
      line-height: 1.5;
    }

    .bottom-ad-title {
      margin-top: 28px;
    }

    @media (min-width: 640px) {
      body {
        padding: 40px 16px;
      }

      .buttons {
        flex-direction: row;
      }

      .button {
        flex: 1;
      }
    }

    /* ===== FLOATING BUBBLE AD ===== */
    .floating-ad {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      max-width: 140px;
    }

    .floating-ad img {
      width: 100%;
      display: block;
      border-radius: 10px;
      border: 1px solid #2a2a3d;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }

    .floating-ad-close {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ff3366;
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: bold;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    @media (max-width: 480px) {
      .floating-ad {
        max-width: 110px;
        right: 8px;
        bottom: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="ad-title">Advertisement</div>

    <div class="ad-box">
      <script>
        atOptions = {

      <script src="https://www.highperformanceformat.com/e9da6473aaf8ead0262ee05934cc04e3/invoke.js"></script>

    <section class="card">
      <h1>🎬 Tonton Video</h1>

      <p class="description">
        Kunjungi tonton iklan terlebih dahulu. Setelah itu,
        kembali ke halaman ini dan tekan tombol “Buka Video”.

      <div class="buttons">
        <a
          id="adButton"
          class="button"
          href="https://www.effectivecpmnetwork.com/paig56k51s?key=3ef24098f954543c64765bd05fddc91d"

        >

        <button
          id="unlockButton"

    </section>

    <section id="videoSection" class="video-section">
      <h2 class="video-heading">Video</h2>

      <div class="video-area">
        <div id="videoLock" class="video-lock">
          <div>
            <h2>Video masih terkunci</h2>
            <p>
              Kunjungi tonton iklan, kembali ke halaman ini,
              lalu tekan tombol “Buka Video”.
            </p>
          </div>
        </div>

        <iframe
          id="videoFrame"
          class="video-frame"
          data-src="https://jumpshare.com/embed/Cf020RMwp0NWDUacjZSn"

          allowfullscreen
        ></iframe>

    <div class="ad-title bottom-ad-title">Advertisement</div>

    <div class="ad-box">
      <script>
        atOptions = {
          'key': 'e9da6473aaf8ead0262ee05934cc04e3',
          'format': 'iframe',
          'height': 250,
          'width': 300,
          'params': {}
        };

  <!-- ===== FLOATING BUBBLE AD ===== -->

    <button id="floatingAdClose" class="floating-ad-close" type="button" title="Tutup">×</button>
    <a href="https://www.effectivecpmnetwork.com/paig56k51s?key=3ef24098f954543c64765bd05fddc91d" 
       target="_blank" 
       rel="nofollow sponsored noopener noreferrer">

  <!-- ===== SCRIPT POPUNDER ADSTERRA ===== -->
  <script src="https://pl30785679.effectivecpmnetwork.com/6e/47/fb/6e47fbaf75f202427e54eb8ec679508e.js"></script>

  <script>
    const adButton = document.getElementById("adButton");
    const unlockButton = document.getElementById("unlockButton");
    const videoLock = document.getElementById("videoLock");
    const videoFrame = document.getElementById("videoFrame");
    const videoSection = document.getElementById("videoSection");

    let sponsorVisited =
      sessionStorage.getItem("sponsorVisited") === "yes";

    if (sponsorVisited) {
      unlockButton.disabled = false;
      unlockButton.textContent = "🔓 Buka Video";
    }

    adButton.addEventListener("click", function () {
      sponsorVisited = true;
      sessionStorage.setItem("sponsorVisited", "yes");

      unlockButton.disabled = false;
      unlockButton.textContent = "🔓 Buka Video";
    });

    // Flag agar popunder hanya sekali per sesi
    let popunderShown = false;

    unlockButton.addEventListener("click", function () {
      if (!sponsorVisited) {
        alert("Silakan kunjungi tonton iklan terlebih dahulu.");
        return;
      }

      // Munculkan popunder Adsterra saat klik "Buka Video"
      if (!popunderShown) {
        popunderShown = true;

        // Panggil fungsi yang biasanya disediakan script Adsterra
        // Kalau script Adsterra otomatis pakai klik apa saja,
        // kita bisa trigger manual dengan membuat elemen klik dummy.
        const dummy = document.createElement("a");
        dummy.href = "#";
        dummy.style.display = "none";
        document.body.appendChild(dummy);

        // Simulasi klik untuk memicu popunder
        const event = new MouseEvent("click", {
          view: window,
          bubbles: true,
          cancelable: true
        });
        dummy.dispatchEvent(event);

        // Bersihkan elemen dummy
        document.body.removeChild(dummy);
      }

      // Baru buka video
      videoFrame.src = videoFrame.dataset.src;
      videoFrame.style.display = "block";
      videoLock.style.display = "none";

      unlockButton.textContent = "✓ Video Terbuka";
      unlockButton.disabled = true;

      videoSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    // ===== FLOATING AD CLOSE BUTTON =====
    const floatingAd = document.getElementById("floatingAd");
    const floatingAdClose = document.getElementById("floatingAdClose");

    floatingAdClose.addEventListener("click", function () {
      floatingAd.style.display = "none";
    });
  </script>
</body>
  </html>
