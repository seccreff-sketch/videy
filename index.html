`<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎬 Tonton Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #101018;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      background: #191927;
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      margin: 0 0 16px;
      color: #bfc3d3;
      line-height: 1.5;
    }

    .banner {
      width: 100%;
      min-height: 250px;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #ff3366;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button.gray {
      background: #343449;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
    }

    .lock {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .82);
      text-align: center;
    }

    .lock-content {
      width: 100%;
    }

    .lock h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .lock p {
      font-size: 14px;
    }

    .small {
      margin-top: 12px;
      color: #8f94a8;
      font-size: 12px;
      text-align: center;
    }

    @media (min-width: 700px) {
      body {
        padding: 40px 16px;
      }

      .box {
        padding: 24px;
      }

      .buttons {
        flex-direction: row;
      }

      .button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>🎬 Tonton Video</h1>

    <p>
      Klik tombol buka iklan terlebih dahulu.
      Setelah kembali ke halaman ini, tekan tombol buka video.
    </p>

    <div class="banner">
      <script>
        atOptions = {
          'key' : 'e9da6473aaf8ead0262ee05934cc04e3',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/e9da6473aaf8ead0262ee05934cc04e3/invoke.js"></script>
    </div>

    <div class="buttons">
      <a
        id="adButton"
        class="button"
        href="https://www.effectivecpmnetwork.com/paig56k51s?key=3ef24098f954543c64765bd05fddc91d"
        target="_blank"
        rel="nofollow noopener noreferrer"
      >
        ▶ Buka Iklan
      </a>

      <button id="unlockButton" class="button gray" type="button">
        🔒 Buka Video
      </button>
    </div>

    <div class="video-box">
      <div id="lock" class="lock">
        <div class="lock-content">
          <h2>Video masih terkunci</h2>
          <p>
            Klik “Buka Iklan”, kembali ke halaman ini,
            lalu tekan “Buka Video”.
          </p>
        </div>
      </div>

      <iframe
        id="video"
        class="video-frame"
        data-src="https://jumpshare.com/embed/Cf020RMwp0NWDUacjZSn"
        allow="fullscreen"
        allowfullscreen
      ></iframe>
    </div>

    <div class="small">
      Video akan dimuat setelah tombol buka video ditekan.
    </div>
  </main>

  <script>
    const adButton = document.getElementById("adButton");
    const unlockButton = document.getElementById("unlockButton");
    const lock = document.getElementById("lock");
    const video = document.getElementById("video");

    adButton.addEventListener("click", function () {
      sessionStorage.setItem("adClicked", "yes");
    });

    unlockButton.addEventListener("click", function () {
      const adClicked = sessionStorage.getItem("adClicked");

      if (adClicked !== "yes") {
        alert("Klik tombol Buka Iklan terlebih dahulu.");
        return;
      }

      video.src = video.dataset.src;
      video.style.display = "block";
      lock.style.display = "none";
      unlockButton.textContent = "✓ Video Terbuka";
      unlockButton.disabled = true;
    });
  </script>
</body>
</html>``
